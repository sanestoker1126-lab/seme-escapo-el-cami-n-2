    <stop stop-color="#777ba7"/><stop offset=".46" stop-color="#464b80"/><stop offset="1" stop-color="#20274f"/>
  </linearGradient>
  <linearGradient id="crystal" x1="0" y1="0" x2=".7" y2="1">
    <stop stop-color="#c7f8ff"/><stop offset=".44" stop-color="#53c9e9"/><stop offset="1" stop-color="#4654b9"/>
  </linearGradient>
  <radialGradient id="edgeGlow"><stop stop-color="#7699da" stop-opacity=".22"/><stop offset="1" stop-color="#435193" stop-opacity="0"/></radialGradient>
</defs>
<!-- Siluetas contenidas en los márgenes: el corredor central permanece vacío. -->
