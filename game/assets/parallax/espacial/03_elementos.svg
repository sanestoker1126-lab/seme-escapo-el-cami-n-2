<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1300" viewBox="0 0 1920 2600" preserveAspectRatio="xMidYMid meet">
  <title>Espacio — fragmentos y cristales de borde</title>
  <defs>
    <linearGradient id="rock" x1="0" y1="0" x2="0.8" y2="1">
      <stop stop-color="#a2a8c9"/><stop offset=".48" stop-color="#68739e"/><stop offset="1" stop-color="#343b70"/>
    </linearGradient>
    <linearGradient id="facet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d0c5e4" stop-opacity=".7"/><stop offset="1" stop-color="#57638e" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="crystal" x1="0" y1="0" x2=".6" y2="1">
      <stop stop-color="#d4ffff"/><stop offset=".45" stop-color="#62d7ed"/><stop offset="1" stop-color="#566bd0"/>
    </linearGradient>
    <g id="fragment">
      <path d="M-68-23L-31-60L25-53L65-14L48 35L-8 55L-57 31Z" fill="url(#rock)" stroke="#b0bad7" stroke-opacity=".4" stroke-width="3"/>
      <path d="M-68-23L-31-60L-17-7L-57 31Z" fill="#293765" opacity=".5"/>
      <path d="M-31-60L25-53L65-14L11 5L-17-7Z" fill="url(#facet)"/>
      <path d="M11 5L48 35L-8 55L-17-7Z" fill="#43527f" opacity=".42"/>
      <circle cx="-3" cy="-15" r="8" fill="#283764" opacity=".45"/>
    </g>
    <g id="crystals" fill="url(#crystal)" stroke="#c2f7ff" stroke-opacity=".5" stroke-width="2">
      <path d="M-20 0L-7-42L5 0Z"/><path d="M2 0L18-30L28 0Z"/><path d="M-35 0L-27-21L-17 0Z"/>
    </g>
  </defs>
  <!-- Pocos fragmentos pequeños, con amplio espacio negativo en el corredor central. -->
  <g opacity=".32" transform="translate(105 560) rotate(-12) scale(.52)"><use href="#fragment"/></g>
  <g opacity=".28" transform="translate(1810 790) rotate(17) scale(.48)"><use href="#fragment"/></g>
  <g opacity=".30" transform="translate(175 1510) rotate(8) scale(.55)"><use href="#fragment"/></g>
  <g opacity=".27" transform="translate(1790 1840) rotate(-16) scale(.46)"><use href="#fragment"/></g>
  <g opacity=".26" transform="translate(110 2340) rotate(11) scale(.50)"><use href="#fragment"/></g>
  <g opacity=".24" transform="translate(1840 2490) rotate(-8) scale(.43)"><use href="#fragment"/></g>
  <g opacity=".45" transform="translate(250 640) scale(.58)"><use href="#crystals"/></g>
  <g opacity=".40" transform="translate(1678 1180) scale(.50)"><use href="#crystals"/></g>
  <g opacity=".42" transform="translate(265 1980) scale(.54)"><use href="#crystals"/></g>
  <g opacity=".38" transform="translate(1660 2170) scale(.48)"><use href="#crystals"/></g>
</svg>
