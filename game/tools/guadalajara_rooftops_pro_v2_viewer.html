<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guadalajara PRO V2 · Inspector de cámara y superficies</title>
<style>body{background:#101824;color:#edf1f8;font:15px system-ui;margin:0;padding:20px;}main{max-width:1100px;margin:auto;}h1{font-size:23px}select,input,button{accent-color:#e6b16a;font:inherit}select,button{background:#273446;color:#fff;border:1px solid #7f94aa;border-radius:6px;padding:8px;}label{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.tools{display:flex;gap:14px;flex-wrap:wrap;margin:16px 0}.panel{border:1px solid #63738a;overflow:auto;border-radius:8px;background:#050d12;}canvas{width:100%;height:auto;display:block}#status{font:12px ui-monospace,monospace;white-space:pre-wrap;color:#b4cce1}p{line-height:1.5;color:#c2d1dc}</style></head><body><main><h1>Guadalajara · Azoteas PRO V2</h1><p>Simulador de encuadre técnico. No modifica física ni reproduce el juego; verifica únicamente el registro de coordenadas.</p><div class="tools"><label>Escena <select id="scene"></select></label><label>Posición X <input id="camx" type="range" min="0" max="1" value="0" step="1"></label><label>Posición Y <input id="camy" type="range" min="0" max="1" value="0" step="1"></label><label><input id="art" type="checkbox" checked> Cornisas</label><label><input id="labels" type="checkbox" checked> Superficies</label></div><div class="panel"><canvas id="view" width="960" height="540"></canvas></div><pre id="status"></pre><p>Verde: pisos fijos · amarillo: escalones · magenta: plataformas móviles (solo posición base). Los elementos en magenta no se insertan en el fondo.</p></main>
<script>const MANIFEST={"portales":{"x":628,"y":1024,"bg":"assets/scenes/guadalajara_rooftops_pro_v2/bg_portales_pro_v2.webp","overlay":"assets/scenes/guadalajara_rooftops_pro_v2/architecture_portales_pro_v2.png","surfaces":[[0,143,164],[0,292,323],[442,628,356],[0,291,523],[438,628,615],[0,341,775],[436,628,862],[0,344,991]],"stairs":[[286,312,329],[311,337,334],[336,362,339],[361,387,344],[386,412,350],[411,441,355],[291,316,538],[316,341,553],[341,366,568],[366,391,583],[391,416,598],[416,441,613],[338,360,789],[358,380,803],[378,400,817],[398,420,831],[418,440,845],[408,430,875],[386,408,890],[364,386,905],[342,364,920],[320,342,935],[298,320,950],[276,298,965],[254,276,980]],"movers":[[298,365,442,23,4],[307,371,705,21,6]]},"centro_historico":{"x":628,"y":1024,"bg":"assets/scenes/guadalajara_rooftops_pro_v2/bg_centro_historico_pro_v2.webp","overlay":"assets/scenes/guadalajara_rooftops_pro_v2/architecture_centro_historico_pro_v2.png","surfaces":[[0,170,140],[458,628,140],[170,458,300],[0,140,380],[488,628,460],[170,430,520],[0,160,600],[468,628,650],[130,498,790],[0,628,990]],"stairs":[],"movers":[[230,330,180,70,6]]},"guadalajara":{"x":1600,"y":450,"bg":"assets/scenes/guadalajara_rooftops_pro_v2/bg_guadalajara_pro_v2.webp","overlay":"assets/scenes/guadalajara_rooftops_pro_v2/architecture_guadalajara_pro_v2.png","surfaces":[[950,1560,90],[120,1120,170],[480,1480,250],[60,860,330],[560,1200,420]],"stairs":[[1000,1082,132],[520,602,212],[1000,1060,292],[600,682,375]],"movers":[]}};const el=n=>document.getElementById(n);const sel=el('scene'),cv=el('view'),ctx=cv.getContext('2d');const pics={};for(const [k,s] of Object.entries(MANIFEST)){const o=document.createElement('option');o.value=k;o.textContent=k;sel.append(o);const p=new Image(),q=new Image();p.src='../'+s.bg;q.src='../'+s.overlay;p.onload=q.onload=()=>render();pics[k]=[p,q];}
function setRange(){const s=MANIFEST[sel.value];el('camx').max=Math.max(0,s.x-500);el('camy').max=Math.max(0,s.y-286);el('camx').value=0;el('camy').value=0;render()}
function render(){const s=MANIFEST[sel.value];if(!s)return;const [p,q]=pics[sel.value];const width=500,height=286,camx=+el('camx').value,camy=+el('camy').value;ctx.fillStyle='#162537';ctx.fillRect(0,0,960,540);
const scaleX=960/width,scaleY=540/height;
ctx.save();ctx.scale(scaleX,scaleY);ctx.translate(-camx,-camy);if(p.complete&&p.naturalWidth)ctx.drawImage(p,0,0,s.x,s.y);if(el('art').checked&&q.complete&&q.naturalWidth)ctx.drawImage(q,0,0,s.x,s.y);
if(el('labels').checked){const sets=[['surfaces','#52ed9a'],['stairs','#ffe16d'],['movers','#ff76e5']];for(const [name,color] of sets){ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=1.1;for(const a of s[name]){const [x1,x2,y]=a;ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(x2,y);ctx.stroke();if(name==='surfaces')ctx.fillText(String(s[name].indexOf(a)+1),x1+2,y-5);}}}
ctx.restore();el('status').textContent=`${sel.value} · mapa ${s.x} × ${s.y} · cámara (${camx}, ${camy}) · ${s.surfaces.length} pisos, ${s.stairs.length} peldaños, ${s.movers.length} móviles.
${p.naturalWidth?'Imagen cargada':'Falta imagen'} · ${q.naturalWidth?'Alfa cargado':'Falta overlay'}`;}
sel.onchange=setRange;for(const id of ['camx','camy','art','labels'])el(id).addEventListener('input',render);setRange();</script></body></html>
